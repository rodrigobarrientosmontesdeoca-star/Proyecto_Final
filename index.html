<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Dinero</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .container {
      margin: 50px auto;
      width: 350px;
      padding: 20px;
      border-radius: 10px;
      background: #222;
    }

    input, button {
      padding: 10px;
      margin: 8px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00ffcc;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #333;
      margin: 5px;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    .delete-btn {
      color: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💸 Control de Dinero</h2>

  <input type="number" id="cantidad" placeholder="Cantidad">

  <br>
  <button onclick="depositar()">Depositar</button>
  <button onclick="retirar()">Retirar</button>

  <h3 id="total">Total: $0</h3>

  <h3>Historial</h3>
  <ul id="historial"></ul>
</div>

<script>
  let total = 0;
  let historial = [];

  // 🔄 Cargar datos (seguro)
  function cargarDatos() {
    try {
      const t = localStorage.getItem("total");
      const h = localStorage.getItem("historial");

      total = t ? parseFloat(t) : 0;
      historial = h ? JSON.parse(h) : [];

    } catch (e) {
      console.warn("localStorage bloqueado, usando memoria");
      total = 0;
      historial = [];
    }
  }

  // 💾 Guardar datos (seguro)
  function guardarDatos() {
    try {
      localStorage.setItem("total", total);
      localStorage.setItem("historial", JSON.stringify(historial));
    } catch (e) {
      console.warn("No se pudo guardar, pero la app sigue funcionando");
    }
  }

  // 🔄 Actualizar UI
  function actualizarUI() {
    document.getElementById("total").innerText =
      "Total: $" + total.toFixed(2);

    const lista = document.getElementById("historial");
    lista.innerHTML = "";

    historial.slice().reverse().forEach((item, index) => {
      const li = document.createElement("li");

      li.innerHTML = `
        ${item.tipo}: $${item.cantidad}
        <span class="delete-btn" onclick="eliminar(${historial.length - 1 - index})">❌</span>
      `;

      lista.appendChild(li);
    });
  }

  // 💰 Depositar
  function depositar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    total += cantidad;

    historial.push({
      tipo: "Depósito",
      cantidad: cantidad
    });

    guardarDatos();
    actualizarUI();

    input.value = "";
  }

  // 💸 Retirar
  function retirar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    if (cantidad > total) {
      alert("Fondos insuficientes");
      return;
    }

    total -= cantidad;

    historial.push({
      tipo: "Retiro",
      cantidad: cantidad
    });

    guardarDatos();
    actualizarUI();

    input.value = "";
  }

  // 🗑️ Eliminar
  function eliminar(index) {
    historial.splice(index, 1);
    guardarDatos();
    actualizarUI();
  }

  // 🚀 INICIAR
  cargarDatos();
  actualizarUI();
</script>

</body>
</html>
