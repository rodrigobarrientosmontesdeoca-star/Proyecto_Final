<script>
  // 🔥 TU CONFIG CON TOKEN
  const BASE_URL = "https://proyecto-final-2e4a8-default-rtdb.firebaseio.com";
  const AUTH = "lnR36eAFqYj3okpIqjvukBwynaEVWHOrdC6vAuaB";

  let total = 0;
  let historial = [];

  // 🔄 LEER DATOS
  async function cargarFirebase() {
    try {
      const res = await fetch(`${BASE_URL}/app.json?auth=${AUTH}`);
      const data = await res.json();

      if (data) {
        total = data.total || 0;
        historial = data.historial
          ? Object.values(data.historial)
          : [];
      }

      actualizarUI();

    } catch (e) {
      console.error("Error al leer Firebase:", e);
    }
  }

  // 💾 GUARDAR TOTAL
  async function guardarTotal() {
    await fetch(`${BASE_URL}/app/total.json?auth=${AUTH}`, {
      method: "PUT",
      body: JSON.stringify(total)
    });
  }

  // 💾 GUARDAR HISTORIAL
  async function guardarHistorial(item) {
    await fetch(`${BASE_URL}/app/historial.json?auth=${AUTH}`, {
      method: "POST",
      body: JSON.stringify(item)
    });
  }

  // 🔄 UI
  function actualizarUI() {
    document.getElementById("total").innerText =
      "Total: $" + total.toFixed(2);

    const lista = document.getElementById("historial");
    lista.innerHTML = "";

    historial.slice().reverse().forEach(item => {
      const li = document.createElement("li");

      li.innerHTML = `
        ${item.tipo}: $${item.cantidad}
      `;

      lista.appendChild(li);
    });
  }

  // 💰 DEPOSITAR
  function depositar() {
    const cantidad = parseFloat(document.getElementById("cantidad").value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    total += cantidad;

    const nuevo = {
      tipo: "Depósito",
      cantidad: cantidad,
      fecha: Date.now()
    };

    historial.push(nuevo);

    actualizarUI();

    // 🔥 GUARDAR EN FIREBASE
    guardarTotal();
    guardarHistorial(nuevo);

    document.getElementById("cantidad").value = "";
  }

  // 💸 RETIRAR
  function retirar() {
    const cantidad = parseFloat(document.getElementById("cantidad").value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    if (cantidad > total) {
      alert("Fondos insuficientes");
      return;
    }

    total -= cantidad;

    const nuevo = {
      tipo: "Retiro",
      cantidad: cantidad,
      fecha: Date.now()
    };

    historial.push(nuevo);

    actualizarUI();

    // 🔥 FIREBASE
    guardarTotal();
    guardarHistorial(nuevo);

    document.getElementById("cantidad").value = "";
  }

  // 🚀 INICIO
  cargarFirebase();
</script>
