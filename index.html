<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Dinero Cloud</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .container {
      margin: 50px auto;
      width: 350px;
      padding: 20px;
      border-radius: 10px;
      background: #222;
    }

    input, button {
      padding: 10px;
      margin: 8px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00ffcc;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #333;
      margin: 5px;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    .delete-btn {
      color: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💸 Control de Dinero</h2>

  <input type="number" id="cantidad" placeholder="Cantidad">

  <br>
  <button onclick="depositar()">Depositar</button>
  <button onclick="retirar()">Retirar</button>

  <h3 id="total">Total: $0</h3>

  <h3>Historial</h3>
  <ul id="historial"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // 🔥 CONFIG (tuya)
  const firebaseConfig = {
    databaseURL: "https://proyecto-final-2e4a8-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const totalRef = db.ref("app/total");
  const historialRef = db.ref("app/historial");

  let total = 0;
  let historial = [];

  // 🔄 Cargar LOCAL
  function cargarLocal() {
    try {
      total = parseFloat(localStorage.getItem("total")) || 0;
      historial = JSON.parse(localStorage.getItem("historial")) || [];
    } catch {
      total = 0;
      historial = [];
    }
  }

  // 💾 Guardar LOCAL
  function guardarLocal() {
    try {
      localStorage.setItem("total", total);
      localStorage.setItem("historial", JSON.stringify(historial));
    } catch {}
  }

  // ☁️ ESCUCHAR FIREBASE
  totalRef.on("value", snap => {
    if (snap.exists()) {
      total = snap.val();
      guardarLocal();
      actualizarUI();
    }
  });

  historialRef.on("value", snap => {
    if (snap.exists()) {
      historial = [];
      snap.forEach(child => {
        historial.push({ key: child.key, ...child.val() });
      });
      guardarLocal();
      actualizarUI();
    }
  });

  // 🔄 UI
  function actualizarUI() {
    document.getElementById("total").innerText =
      "Total: $" + total.toFixed(2);

    const lista = document.getElementById("historial");
    lista.innerHTML = "";

    historial.slice().reverse().forEach(item => {
      const li = document.createElement("li");

      li.innerHTML = `
        ${item.tipo}: $${item.cantidad}
        <span class="delete-btn" onclick="eliminar('${item.key || ''}')">❌</span>
      `;

      lista.appendChild(li);
    });
  }

  // 💰 Depositar
  function depositar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    total += cantidad;

    const nuevo = {
      tipo: "Depósito",
      cantidad: cantidad,
      fecha: Date.now()
    };

    historial.push(nuevo);

    guardarLocal();
    actualizarUI();

    // ☁️ Intentar guardar en Firebase
    totalRef.set(total).catch(()=>{});
    historialRef.push(nuevo).catch(()=>{});

    input.value = "";
  }

  // 💸 Retirar
  function retirar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (!cantidad || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    if (cantidad > total) {
      alert("Fondos insuficientes");
      return;
    }

    total -= cantidad;

    const nuevo = {
      tipo: "Retiro",
      cantidad: cantidad,
      fecha: Date.now()
    };

    historial.push(nuevo);

    guardarLocal();
    actualizarUI();

    // ☁️ Firebase
    totalRef.set(total).catch(()=>{});
    historialRef.push(nuevo).catch(()=>{});

    input.value = "";
  }

  // 🗑️ Eliminar
  function eliminar(key) {
    if (!key) {
      alert("Solo se puede eliminar si está en la nube");
      return;
    }

    historialRef.child(key).remove().catch(()=>{});
  }

  // 🚀 INICIO
  cargarLocal();
  actualizarUI();
</script>

</body>
</html>
