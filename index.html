<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Dinero Cloud</title>
  <style>
    body {
      background: linear-gradient(135deg, #0b0b0b, #1a1a1a);
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      margin: 60px auto;
      width: 400px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    h2 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
    input, button { margin: 10px; padding: 12px; border-radius: 8px; }
    ul { list-style: none; padding: 0; }
    ul li { display: flex; justify-content: space-between; }
    .delete-btn { color: #ff4444; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>💸 Control de Dinero</h2>
    <input type="number" id="cantidad" placeholder="Cantidad">
    <br>
    <button onclick="depositar()">Depositar</button>
    <button onclick="retirar()">Retirar</button>
    <h3 id="total">Total: $0</h3>
    <h3>Historial</h3>
    <ul id="historial"></ul>
  </div>

  <!-- Firebase V8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    // ⚠️ CONFIGURACIÓN COMPLETA DE FIREBASE
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "proyecto-final-2e4a8.firebaseapp.com",
      databaseURL: "https://proyecto-final-2e4a8-default-rtdb.firebaseio.com",
      projectId: "proyecto-final-2e4a8",
      storageBucket: "proyecto-final-2e4a8.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "lnR36eAFqYj3okpIqjvukBwynaEVWHOrdC6vAuaB"
    };
    firebase.initializeApp(firebaseConfig);

    const db = firebase.database();
    const totalRef = db.ref("app/total");
    const historialRef = db.ref("app/historial");
    const accionRef = db.ref("app/accion");

    let totalActual = 0;

    totalRef.on("value", (snapshot) => {
      totalActual = snapshot.val() || 0;
      document.getElementById("total").innerText = "Total: $" + totalActual.toFixed(2);
    });

    historialRef.on("value", (snapshot) => {
      const lista = document.getElementById("historial");
      lista.innerHTML = "";
      snapshot.forEach((child) => {
        const data = child.val();
        const key = child.key;
        const li = document.createElement("li");
        li.innerHTML = `${data.tipo}: $${data.cantidad} <span class="delete-btn" onclick="eliminar('${key}')">❌</span>`;
        lista.appendChild(li);
      });
    });

    function depositar() {
      let cantidad = parseFloat(document.getElementById("cantidad").value);
      if (isNaN(cantidad) || cantidad <= 0) { alert("Cantidad inválida"); return; }
      totalActual += cantidad;
      totalRef.set(totalActual);
      historialRef.push({ tipo: "Depósito", cantidad: cantidad, fecha: Date.now() });
      accionRef.set("deposito");
      document.getElementById("cantidad").value = "";
    }

    function retirar() {
      let cantidad = parseFloat(document.getElementById("cantidad").value);
      if (isNaN(cantidad) || cantidad <= 0) { alert("Cantidad inválida"); return; }
      if (cantidad > totalActual) { alert("Fondos insuficientes"); return; }
      totalActual -= cantidad;
      totalRef.set(totalActual);
      historialRef.push({ tipo: "Retiro", cantidad: cantidad, fecha: Date.now() });
      accionRef.set("retiro");
      document.getElementById("cantidad").value = "";
    }

    function eliminar(key) {
      if(confirm("¿Eliminar esta transacción?")) {
        historialRef.child(key).remove();
      }
    }
  </script>
</body>
</html>
