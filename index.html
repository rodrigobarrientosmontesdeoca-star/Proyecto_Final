<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Dinero Cloud</title>

  <style>
    body {
      background: linear-gradient(135deg, #0b0b0b, #1a1a1a);
      color: #fff;
      font-family: Arial;
      text-align: center;
    }

    .container {
      margin: 60px auto;
      width: 350px;
      padding: 25px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
    }

    input, button {
      padding: 10px;
      margin: 8px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00ffcc;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: rgba(255,255,255,0.1);
      margin: 5px;
      padding: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
    }

    .delete-btn {
      color: red;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💸 Control de Dinero</h2>

  <input type="number" id="cantidad" placeholder="Cantidad">

  <br>
  <button onclick="depositar()">Depositar</button>
  <button onclick="retirar()">Retirar</button>

  <h3 id="total">Total: $0</h3>

  <h3>Historial</h3>
  <ul id="historial"></ul>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // 🔥 SOLO databaseURL (como tu proyecto)
  const firebaseConfig = {
    databaseURL: "https://proyecto-final-2e4a8-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const totalRef = db.ref("app/total");
  const historialRef = db.ref("app/historial");

  let totalActual = 0;

  // 🔄 ESCUCHAR TOTAL
  totalRef.on("value", snap => {
    totalActual = snap.val() || 0;
    document.getElementById("total").innerText =
      "Total: $" + totalActual.toFixed(2);
  });

  // 🔄 ESCUCHAR HISTORIAL
  historialRef.on("value", snap => {
    const lista = document.getElementById("historial");
    lista.innerHTML = "";

    snap.forEach(child => {
      const data = child.val();
      const key = child.key;

      const li = document.createElement("li");
      li.innerHTML = `
        ${data.tipo}: $${data.cantidad}
        <span class="delete-btn" onclick="eliminar('${key}')">❌</span>
      `;

      lista.appendChild(li);
    });
  });

  // 💰 DEPOSITAR
  function depositar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (isNaN(cantidad) || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    const nuevoTotal = totalActual + cantidad;

    totalRef.set(nuevoTotal)
      .then(() => {
        return historialRef.push({
          tipo: "Depósito",
          cantidad: cantidad,
          fecha: Date.now()
        });
      })
      .then(() => {
        input.value = "";
      })
      .catch(err => {
        console.error(err);
        alert("Error al guardar (revisa reglas)");
      });
  }

  // 💸 RETIRAR
  function retirar() {
    const input = document.getElementById("cantidad");
    const cantidad = parseFloat(input.value);

    if (isNaN(cantidad) || cantidad <= 0) {
      alert("Cantidad inválida");
      return;
    }

    if (cantidad > totalActual) {
      alert("Fondos insuficientes");
      return;
    }

    const nuevoTotal = totalActual - cantidad;

    totalRef.set(nuevoTotal)
      .then(() => {
        return historialRef.push({
          tipo: "Retiro",
          cantidad: cantidad,
          fecha: Date.now()
        });
      })
      .then(() => {
        input.value = "";
      })
      .catch(err => {
        console.error(err);
        alert("Error al guardar");
      });
  }

  // 🗑️ ELIMINAR
  function eliminar(key) {
    if (confirm("¿Eliminar?")) {
      historialRef.child(key).remove();
    }
  }
</script>

</body>
</html>
